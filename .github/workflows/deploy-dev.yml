# Deploy to DEV — fires on every PR and on pushes to feature/* branches.
# Target: https://dev.my-testo.com (pm2 process `trt-dev` on :3001,
# separate Postgres DB `trt_dev` — synthetic seed data, never real PHI).
#
# Runs on the SELF-HOSTED runner (`trt-lxc`) which IS the LXC box. Writes
# directly to /opt/trt-dev/apps/web/.env.local, runs ci-deploy.sh locally.
name: Deploy DEV

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/*]

concurrency:
  group: deploy-dev-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy to dev.my-testo.com
    runs-on: [self-hosted, LXC]
    environment:
      name: development
      url: https://dev.my-testo.com
    if: github.repository == 'toxykdude/TRT'
    steps:
      - name: Start GitHub deployment record
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: development
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          desc: "PR #${{ github.event.pull_request.number || 'direct push' }} → dev.my-testo.com"

      - name: Render apps/web/.env.local for DEV directly on the box
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SALT: ${{ secrets.NEXTAUTH_SALT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          WOMPI_ENV: ${{ secrets.WOMPI_ENV }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          umask 077
          cat > /opt/trt-dev/apps/web/.env.local <<EOF
          # Auto-rendered by GitHub Actions DEV deploy at ${TARGET_SHA}
          # DO NOT EDIT BY HAND — overwritten on every deploy.
          DATABASE_URL="${DATABASE_URL}"
          NEXTAUTH_URL="https://dev.my-testo.com"
          AUTH_SECRET="${AUTH_SECRET}"
          NEXTAUTH_SALT="${NEXTAUTH_SALT}"
          OPENAI_API_KEY="${OPENAI_API_KEY}"
          OPENAI_API_URL="${OPENAI_API_URL}"
          OPENAI_MODEL="${OPENAI_MODEL}"
          RESEND_API_KEY="${RESEND_API_KEY}"
          EMAIL_FROM="${EMAIL_FROM}"
          GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
          MCP_AUTH_TOKEN="${MCP_AUTH_TOKEN}"
          WOMPI_ENV="${WOMPI_ENV}"
          WOMPI_PUBLIC_KEY="${WOMPI_PUBLIC_KEY}"
          WOMPI_EVENTS_SECRET="${WOMPI_EVENTS_SECRET}"
          WOMPI_INTEGRITY_SECRET="${WOMPI_INTEGRITY_SECRET}"
          UPLOADS_DIR="/var/lib/trt-dev/uploads"
          KB_DB_PATH="/var/lib/trt-dev/kb/knowledge.db"
          KB_TEXT_DIR="/var/lib/trt-dev/kb/text"
          CORPUS_DIR="/var/lib/trt-dev/corpus"
          OCR_ENDPOINT="https://imagedit.powerhousegym.co/ocr"
          GRAPHITI_MCP_URL="http://127.0.0.1:8000"
          GRAPH_QUERY_URL="http://127.0.0.1:8001"
          MCP_HTTP_HOST="127.0.0.1"
          MCP_HTTP_PORT="8003"
          # NODE_ENV is "production" even on DEV, deliberately. This is a real
          # server build, not `next dev`: with NODE_ENV=development, `next build`
          # pulls the development react-dom and dies prerendering the error page
          # ("Export encountered an error on /_error: /404, exiting the build").
          # Verified on the box — identical commit and env file, flipping only
          # this value, turns a failing build into a passing one. DEV is
          # distinguished by its own database (trt_dev), URL, port and data dirs,
          # NOT by NODE_ENV.
          #
          # Consequence to keep in mind: apps/web/src/lib/email.ts only falls back
          # to console-logging OTP codes when NODE_ENV !== "production", so DEV now
          # needs a real (or test) RESEND_API_KEY in the development environment
          # secrets, or OTP sends there will throw instead of logging.
          NODE_ENV="production"
          EOF
          chmod 600 /opt/trt-dev/apps/web/.env.local
          echo "Rendered $(wc -l < /opt/trt-dev/apps/web/.env.local) lines"

      - name: Run deploy (ci-deploy.sh lives in the dev checkout)
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          cd /opt/trt-dev
          TARGET_SHA="$TARGET_SHA" DEPLOY_ACTOR="$DEPLOY_ACTOR" \
            bash scripts/ci-deploy.sh development

      - name: Comment on PR with DEV URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **DEV deploy live:** https://dev.my-testo.com\n\nCommit: \`${sha}\`\n\nDEV uses a separate Postgres DB (\`trt_dev\`) — no PHI.`
            });

      - name: Finish deployment (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: success
          env: development
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://dev.my-testo.com

      - name: Finish deployment (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: failure
          env: development
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
