# Deploy to PRODUCTION — fires ONLY on push to main (i.e., after PR merge).
# Target: https://my-testo.com (pm2 process `trt` on :3000, Postgres DB `trt`).
#
# Runs on the SELF-HOSTED runner (`trt-lxc`) which IS the LXC box. No SSH needed —
# .env.local is written directly to the prod checkout, ci-deploy.sh runs locally.
#
# Hard rules:
#   - Depends on PR Validation passing (enforced by branch protection).
#   - prisma migrate deploy runs unattended — author migrations carefully.
#   - Zero downtime via `pm2 reload --update-env`.
name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to my-testo.com
    runs-on: [self-hosted, LXC]
    environment:
      name: production
      url: https://my-testo.com
    if: github.repository == 'toxykdude/TRT'
    steps:
      - name: Start GitHub deployment record
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.sha }}
          desc: "main → my-testo.com"

      - name: Render apps/web/.env.local directly on the box
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SALT: ${{ secrets.NEXTAUTH_SALT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          WOMPI_ENV: ${{ secrets.WOMPI_ENV }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          umask 077
          cat > /opt/trt/apps/web/.env.local <<EOF
          # Auto-rendered by GitHub Actions PRODUCTION deploy at ${TARGET_SHA}
          # DO NOT EDIT BY HAND — overwritten on every deploy.
          DATABASE_URL="${DATABASE_URL}"
          NEXTAUTH_URL="https://my-testo.com"
          AUTH_SECRET="${AUTH_SECRET}"
          NEXTAUTH_SALT="${NEXTAUTH_SALT}"
          OPENAI_API_KEY="${OPENAI_API_KEY}"
          OPENAI_API_URL="${OPENAI_API_URL}"
          OPENAI_MODEL="${OPENAI_MODEL}"
          RESEND_API_KEY="${RESEND_API_KEY}"
          EMAIL_FROM="${EMAIL_FROM}"
          GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"
          GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}"
          MCP_AUTH_TOKEN="${MCP_AUTH_TOKEN}"
          WOMPI_ENV="${WOMPI_ENV}"
          WOMPI_PUBLIC_KEY="${WOMPI_PUBLIC_KEY}"
          WOMPI_EVENTS_SECRET="${WOMPI_EVENTS_SECRET}"
          WOMPI_INTEGRITY_SECRET="${WOMPI_INTEGRITY_SECRET}"
          UPLOADS_DIR="/var/lib/trt/uploads"
          KB_DB_PATH="/var/lib/trt/kb/knowledge.db"
          KB_TEXT_DIR="/var/lib/trt/kb/text"
          CORPUS_DIR="/var/lib/trt/corpus"
          OCR_ENDPOINT="https://imagedit.powerhousegym.co/ocr"
          GRAPHITI_MCP_URL="http://127.0.0.1:8000"
          GRAPH_QUERY_URL="http://127.0.0.1:8001"
          MCP_HTTP_HOST="127.0.0.1"
          MCP_HTTP_PORT="8002"
          NODE_ENV="production"
          EOF
          chmod 600 /opt/trt/apps/web/.env.local
          echo "Rendered $(wc -l < /opt/trt/apps/web/.env.local) lines to /opt/trt/apps/web/.env.local"

      - name: Run deploy (ci-deploy.sh lives in the prod checkout)
        env:
          TARGET_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          cd /opt/trt
          TARGET_SHA="$TARGET_SHA" DEPLOY_ACTOR="$DEPLOY_ACTOR" \
            bash scripts/ci-deploy.sh production

      - name: Finish deployment (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: success
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://my-testo.com

      - name: Finish deployment (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: failure
          env: production
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
