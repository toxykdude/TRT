# PR validation — runs on every PR targeting main. Must pass to merge.
# Gates: lint, typecheck, unit tests, build verification.
#
# Known issue (AGENTS.md §1.5): `@trt/db` typecheck is RED (missing @types/node,
# prisma outside rootDir). This workflow will fail on first PR until that's fixed.
# That's CI doing its job — do not weaken this workflow to bypass it; fix the db.
name: PR Validation

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR (saves CI minutes, avoids races).
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json pins
      # "packageManager": "pnpm@10.18.0", and action-setup@v4 hard-errors when a
      # version is given in BOTH places ("Multiple versions of pnpm specified"),
      # which failed this job before it ever reached a gate. Letting the action
      # read packageManager keeps CI and the deploy host on one pinned version.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/src/generated is gitignored — the Prisma client is generated,
      # never committed. Without this step @trt/db cannot resolve
      # './generated/client/index.js', so typecheck, test and build all fail on a
      # clean checkout. ci-deploy.sh already does this before building; PR
      # validation needs the same. No database is contacted: `prisma generate`
      # only reads schema.prisma and emits types.
      - name: Generate Prisma client
        run: pnpm --filter @trt/db generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build verification
        env:
          # Build doesn't need a real DB connection, but Next.js may still read
          # some vars at build time. Use a placeholder DATABASE_URL to satisfy
          # any build-time client instantiation (Prisma client is lazy).
          DATABASE_URL: "postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?schema=public"
          AUTH_SECRET: "build-time-placeholder-not-used-at-runtime"
          NEXTAUTH_URL: "https://my-testo.com"
        run: pnpm build
